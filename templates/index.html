<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Optimizer Configuration</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form > div { margin-bottom: 1em; }
        label { display: block; margin-bottom: 0.2em; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .size-inputs { display: flex; gap: 1em; }
        .size-inputs > div { flex: 1; }
    </style>
</head>
<body>
    <h1>Optimizer Configuration</h1>

    {% if message %}
        <p style="color: green;"><b>{{ message }}</b></p>
    {% endif %}
    {% if error %}
        <p style="color: red;"><b>Error: {{ error }}</b></p>
    {% endif %}

    <form method="post">
        <h2>Default Board Size</h2>
        <div class="size-inputs">
            <div>
                <label for="default_width">Default Width:</label>
                <input type="number" id="default_width" name="default_width" value="{{ config.default_width }}">
            </div>
            <div>
                <label for="default_length">Default length:</label>
                <input type="number" id="default_length" name="default_length" value="{{ config.default_length }}">
            </div>
        </div>
        
        <h2>Data File Paths</h2>
        <div>
            <label for="hhos_path">HHOS File Path:</label>
            <input type="text" id="hhos_path" name="hhos_path" value="{{ config.hhos_path }}" required>
        </div>
        <div>
            <label for="offcut_path">Offcut List Path:</label>
            <input type="text" id="offcut_path" name="offcut_path" value="{{ config.offcut_path }}" required>
        </div>
        <div>
            <label for="stock_path">Stock Part Inventory Path:</label>
            <input type="text" id="stock_path" name="stock_path" value="{{ config.stock_path }}" required>
        </div>
        <button type="submit">Save and Process</button>
    </form>
</body>
</html>
