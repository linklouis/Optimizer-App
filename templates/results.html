<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimization Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{{ 'dark-mode' if config.dark_mode else '' }}">

    <div class="container" id="results-container" data-job-id="{{ job_id }}">
        <header>
            <div class="logo">
                <i class="fa-solid fa-chart-pie"></i>
                <h1>Optimization Results</h1>
            </div>
            <a href="{{ url_for('configure') }}" class="back-button"><i class="fa-solid fa-arrow-left"></i> Back to Config</a>
        </header>

        <div id="loader" class="loader-container">
            <div class="spinner"></div>
            <p>Running optimization... This may take a moment.</p>
        </div>

        <div id="results-content" class="hidden">
            </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
