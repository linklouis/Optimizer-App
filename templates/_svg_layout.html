<svg viewBox="-2 -2 {{ layout.sheet_info.width + 4 }} {{ layout.sheet_info.length + 4 }}">
    <defs>
        <pattern id="stockPattern" patternUnits="userSpaceOnUse" width="5" height="5">
            <rect width="5" height="5" fill="var(--stock-part-fill)"/>
            <circle cx="2.5" cy="2.5" r="0.8" fill="rgba(0,0,0,0.4)"/>
        </pattern>

        <pattern id="offcutPattern" patternUnits="userSpaceOnUse" width="6" height="6">
            <rect width="6" height="6" fill="var(--offcut-fill)"/>
            <path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke-width="0.7" stroke="rgba(0,0,0,0.4)" stroke-linecap="round"/>
        </pattern>
    </defs>
    <rect class="sheet-bg" x="0" y="0" width="{{ layout.sheet_info.width }}" height="{{ layout.sheet_info.length }}"/>
    {% for part in layout.placed_parts %}
        {% set p_length = part.width if part.rotated else part.length %}
        {% set p_width = part.length if part.rotated else part.width %}
        {% set svg_y = layout.sheet_info.length - part.y - p_length %}
        
        <g class="part-group {% if part.is_stock_part %}removable-stock-part{% endif %}" 
           transform="translate({{ part.x }}, {{ svg_y }})" 
           data-part-index="{{ loop.index0 }}">
            
            <rect class="{{ 'stock-part' if part.is_stock_part else 'job-part' }}" width="{{ p_width }}" height="{{ p_length }}"/>
            
            {% if part.is_stock_part %}
                <text class="remove-icon" x="{{ p_width / 2 }}" y="{{ p_length / 2 }}" dominant-baseline="middle" text-anchor="middle">&#x2716;</text>
            {% endif %}

            {% if p_length > p_width * 1.5 and p_width > 4 %}
                <text class="part-label" text-anchor="middle" dominant-baseline="middle" transform="translate({{ p_width / 2 }}, {{ p_length / 2 }}) rotate(90)">
                    {% if part.is_stock_part %}STOCK{% else %}{{ part.label }}{% endif %}
                </text>
            {% elif p_width > 8 and p_length > 4 %} 
                 <text class="part-label" x="{{ p_width / 2 }}" y="{{ p_length / 2 }}" dominant-baseline="middle" text-anchor="middle">
                    {% if part.is_stock_part %}STOCK{% else %}{{ part.label }}{% endif %}
                </text>
            {% endif %}

            {% set text_padding = 1.5 %}
            {% if p_width > 6 %}
                <text class="inner-dim-text" text-anchor="middle" dominant-baseline="hanging" x="{{ p_width / 2 }}" y="{{ text_padding }}">{{ '%.2f' % p_width }}</text>
            {% endif %}
            {% if p_length > 6 %}
                 <text class="inner-dim-text" text-anchor="middle" dominant-baseline="hanging" transform="translate({{ text_padding }}, {{ p_length / 2 }}) rotate(-90)">{{ '%.2f' % p_length }}</text>
            {% endif %}
        </g>
    {% endfor %}
    {% for offcut in layout.usable_offcuts %}
        {% set svg_y = layout.sheet_info.length - offcut.y - offcut.length %}
        <g class="offcut-group" transform="translate({{ offcut.x }}, {{ svg_y }})">
            <rect class="offcut" width="{{ offcut.width }}" height="{{ offcut.length }}"/>
            {% if offcut.length > offcut.width * 1.5 and offcut.width > 4 %}
                <text class="offcut-label" text-anchor="middle" dominant-baseline="middle" transform="translate({{ offcut.width / 2 }}, {{ offcut.length / 2 }}) rotate(90)">Offcut</text>
            {% elif offcut.width > 8 and offcut.length > 4 %}
                <text class="offcut-label" x="{{ offcut.width / 2 }}" y="{{ offcut.length / 2 }}" dominant-baseline="middle" text-anchor="middle">Offcut</text>
            {% endif %}
            {% set text_padding = 1.5 %}
            {% if offcut.width > 6 %}
                <text class="inner-dim-text" text-anchor="middle" dominant-baseline="hanging" x="{{ offcut.width / 2 }}" y="{{ text_padding }}">{{ '%.2f' % offcut.width }}</text>
            {% endif %}
            {% if offcut.length > 6 %}
                <text class="inner-dim-text" text-anchor="middle" dominant-baseline="hanging" transform="translate({{ text_padding }}, {{ offcut.length / 2 }}) rotate(-90)">{{ '%.2f' % offcut.length }}</text>
            {% endif %}
        </g>
    {% endfor %}
    <g class="cut-line-group">
        {% for part in layout.placed_parts %}
            {% set p_length = part.width if part.rotated else part.length %}
            {% set p_width = part.length if part.rotated else part.width %}
            {% set svg_y = layout.sheet_info.length - part.y - p_length %}
            <line class="cut-line" x1="{{ part.x }}" y1="{{ svg_y + p_length }}" x2="{{ part.x + p_width }}" y2="{{ svg_y + p_length }}" />
            <line class="cut-line" x1="{{ part.x + p_width }}" y1="{{ svg_y }}" x2="{{ part.x + p_width }}" y2="{{ svg_y + p_length }}" />
        {% endfor %}
    </g>
</svg>
