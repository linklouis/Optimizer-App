<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Optimizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{{ 'dark-mode' if config.dark_mode else '' }}">
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h1>Cutting Stock Optimizer</h1>
            </div>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="darkmode-toggle" aria-label="Toggle dark mode">
                    <input type="checkbox" id="darkmode-toggle" {% if config.dark_mode %}checked{% endif %}>
                    <span class="slider"></span>
                </label>
            </div>
        </header>

        <main>
            <form method="post" id="config-form">
                <input type="hidden" name="dark_mode" id="dark_mode_state" value="{{ 'on' if config.dark_mode else 'off' }}">
                
                {% if message %} <div class="alert alert-success">{{ message }}</div> {% endif %}
                {% if error %} <div class="alert alert-danger">{{ error }}</div> {% endif %}

                <div class="card">
                    <h2><i class="fa-solid fa-file-alt"></i> Input Files</h2>
                    <div class="form-grid">
                        <div><label for="hhos_path">HHOS Part List</label><input type="text" id="hhos_path" name="hhos_path" value="{{ config.hhos_path }}"></div>
                        <div><label for="stock_inv_path">Stock Inventory</label><input type="text" id="stock_inv_path" name="stock_inv_path" value="{{ config.stock_inv_path }}"></div>
                        <div><label for="offcut_path">Offcut List</label><input type="text" id="offcut_path" name="offcut_path" value="{{ config.offcut_path }}" placeholder="e.g., C:\data\offcuts.csv"></div>
                    </div>
                </div>

                <div class="content-grid">
                    <div class="card">
                        <h2><i class="fa-solid fa-cogs"></i> General Settings</h2>
                        <div class="form-grid">
                            <div><label for="default_length">Default Length</label><input type="number" step="any" id="default_length" name="default_length" value="{{ config.default_length }}"></div>
                            <div><label for="default_width">Default Width</label><input type="number" step="any" id="default_width" name="default_width" value="{{ config.default_width }}"></div>
                            <div><label for="kerf">Kerf</label><input type="number" step="any" id="kerf" name="kerf" value="{{ config.kerf }}"></div>
                            <div><label for="min_offcut_dim">Min Offcut Dim</label><input type="number" step="any" id="min_offcut_dim" name="min_offcut_dim" value="{{ config.min_offcut_dim }}"></div>
                            <div><label for="search_time_limit">Search Time (s)</label><input type="number" step="any" id="search_time_limit" name="search_time_limit" value="{{ config.search_time_limit }}"></div>
                        </div>
                         <div class="checkbox-grid">
                            <label class="checkbox-group"><input type="checkbox" name="allow_rotation" {% if config.allow_rotation %}checked{% endif %}>Allow Rotation</label>
                            <label class="checkbox-group"><input type="checkbox" name="use_offcuts" {% if config.use_offcuts %}checked{% endif %}>Use Offcuts</label>
                            <label class="checkbox-group"><input type="checkbox" name="add_stock_parts" {% if config.add_stock_parts %}checked{% endif %}>Add Stock Parts</label>
                        </div>
                    </div>

                    <div class="card">
                        <h2><i class="fa-solid fa-balance-scale"></i> Scoring Weights</h2>
                        <div class="form-grid">
                            <div><label for="w_waste">Waste Penalty</label><input type="number" step="any" name="w_waste" value="{{ config.w_waste }}"></div>
                            <div><label for="w_offcut">Offcut Penalty</label><input type="number" step="any" name="w_offcut" value="{{ config.w_offcut }}"></div>
                            <div><label for="w_cuts">Cuts Penalty</label><input type="number" step="any" name="w_cuts" value="{{ config.w_cuts }}"></div>
                            <div><label for="w_quantity">Inv. Bonus</label><input type="number" step="any" name="w_quantity" value="{{ config.w_quantity }}"></div>
                            <div><label for="w_sheets">Sheet Penalty</label><input type="number" step="any" name="w_sheets" value="{{ config.w_sheets }}"></div>
                            <div><label for="w_stock_fill">Stock Fill Bonus</label><input type="number" step="any" name="w_stock_fill" value="{{ config.w_stock_fill }}"></div>
                        </div>
                    </div>
                </div>

                {% if all_stock_parts %}
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-boxes-stacked"></i> Select Stock Parts to Create</h2>
                        <div class="selection-buttons">
                            <button type="button" id="select-all-stock">Select All</button>
                            <button type="button" id="deselect-all-stock">Deselect All</button>
                        </div>
                    </div>
                    <div class="stock-selector">
                        {% for part in all_stock_parts %}
                        <label class="stock-item">
                            <input type="checkbox" name="selected_stock_parts" value="{{ part.internal_ref }}" {% if part.internal_ref in config.selected_stock_parts %}checked{% endif %}>
                            <div class="stock-item-details">
                                <strong>{{ part.part_name }}</strong> ({{ part.length|round(2) }} x {{ part.width|round(2) }})
                                <span>Need: {{ (part.target_stock - part.current_stock) | int }}</span>
                            </div>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                {% endif %}
                
                <button type="submit" class="submit-button">
                    <i class="fa-solid fa-calculator"></i> Save & Optimize
                </button>
            </form>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
